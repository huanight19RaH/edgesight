[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesight"
version = "0.1.0"
description = "EdgeSight: Lightweight Edge Vision & Hand Gesture Recognition with Benchmarking and Quantization"
readme = "README.md"
authors = [{ name = "Thai Hung Nguyen", email = "hungnguyen.190206@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "rich>=13.7.0"
]

[project.scripts]
edgesight = "edgesight.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
